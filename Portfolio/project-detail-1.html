<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Proyecto | Máximo Hidalgo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project-detail-1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo" data-cursor-hover>Maximo Hidalgo</a>
            <nav class="nav">
                <a href="index.html#work" class="nav-link" data-cursor-hover>Proyectos</a>
                <a href="index.html#experience" class="nav-link" data-cursor-hover>Experiencia</a>
                <a href="index.html#about" class="nav-link" data-cursor-hover>Sobre mí</a>
                <div class="switch-container">
                    <label for="switch" class="switch" aria-label="Toggle dark mode">
                        <input id="switch" type="checkbox" />
                        <span class="slider"></span>
                    </label>
                </div>
            </nav>
            <button class="menu-toggle" aria-label="Toggle menu">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </button>
        </div>
    </header>

    <main class="project-detail-main">
        <div class="container">
            <a href="index.html#work" class="back-button" data-cursor-hover>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Volver a proyectos
            </a>

            <article class="project-detail">
                <div class="project-gallery">
                    <!-- Imágenes se cargarán dinámicamente -->
                </div>
                
                <div class="project-content">
                    <h1 class="project-title">Título del Proyecto</h1>
                    <p class="project-category">Categoría</p>
                    
                    <div class="project-description">
                        <p>Descripción detallada del proyecto...</p>
                    </div>
                    
                    <div class="project-meta">
                        <div class="project-technologies">
                            <h3>Tecnologías utilizadas</h3>
                            <div class="tech-tags">
                                <!-- Tecnologías se cargarán dinámicamente -->
                            </div>
                        </div>
                        
                        <a href="#" class="project-link" target="_blank" rel="noopener" data-cursor-hover>
                            Ver proyecto en vivo
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6m4-3h6v6m-11 5L21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/gsap.min.js"></script>
    <script src="js/project-detail-1.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
